add_floor:
  name: Ajouter un étage
  description: Ajoute un étage à la cave.
  fields:
    name:
      description: Nom de l'étage
      example: "Bordeaux"
    columns:
      description: Nombre de colonnes
      example: 8
    rows:
      description: Nombre de rangées
      example: 2
    layout:
      description: "Disposition : side_by_side ou alternating"
      example: "side_by_side"

update_floor:
  name: Modifier un étage
  description: Modifie un étage existant.
  fields:
    floor_id:
      description: ID de l'étage
      required: true
    name:
      description: Nouveau nom
    columns:
      description: Nombre de colonnes
    rows:
      description: Nombre de rangées
    layout:
      description: Disposition

remove_floor:
  name: Supprimer un étage
  description: Supprime un étage et ses bouteilles.
  fields:
    floor_id:
      description: ID de l'étage
      required: true

add_bottle:
  name: Ajouter une bouteille
  description: Ajoute une bouteille à la cave.
  fields:
    floor_id:
      description: ID de l'étage
      required: true
    slot:
      description: Numéro d'emplacement
      required: true
    name:
      description: Nom du vin
      required: true
    vintage:
      description: Millésime (année)
    type:
      description: "Type : red, white, rose, sparkling, dessert"
    appellation:
      description: Appellation
    region:
      description: Région
    producer:
      description: Producteur
    country:
      description: Pays
    price:
      description: Prix en euros
    quantity:
      description: Quantité
    drink_from:
      description: À boire à partir de (année)
    drink_until:
      description: À boire avant (année)
    notes:
      description: Notes personnelles
    tasting_notes:
      description: Notes de dégustation
    food_pairing:
      description: Accords mets-vins
    event:
      description: "Événement : no_touch, keep, special, drink, table"
    vivino_rating:
      description: Note /5
    image_url:
      description: URL de l'image
    vivino_url:
      description: Lien Vivino

update_bottle:
  name: Modifier une bouteille
  description: Modifie une bouteille existante.
  fields:
    bottle_id:
      description: ID de la bouteille
      required: true
    name:
      description: Nom du vin
    vintage:
      description: Millésime
    type:
      description: Type de vin
    appellation:
      description: Appellation
    region:
      description: Région
    producer:
      description: Producteur
    country:
      description: Pays
    price:
      description: Prix
    quantity:
      description: Quantité
    drink_from:
      description: À boire à partir de
    drink_until:
      description: À boire avant
    notes:
      description: Notes personnelles
    tasting_notes:
      description: Notes de dégustation
    food_pairing:
      description: Accords mets-vins
    event:
      description: Événement
    vivino_rating:
      description: Note /5
    image_url:
      description: URL image
    vivino_url:
      description: Lien Vivino

remove_bottle:
  name: Retirer une bouteille
  description: Retire une bouteille de la cave.
  fields:
    bottle_id:
      description: ID de la bouteille
      required: true

rename_cellar:
  name: Renommer une cave
  description: Change le nom d'une cave (la première cave si cellar_id est omis).
  fields:
    cellar_id:
      description: ID de la cave (optionnel, première cave par défaut)
    name:
      description: Nouveau nom
      required: true

add_cellar:
  name: Ajouter une cave
  description: Crée une nouvelle cave vide dans l'instance.
  fields:
    name:
      description: Nom de la cave
      example: "Cave du garage"

remove_cellar:
  name: Supprimer une cave
  description: Supprime une cave vide (refusé si elle contient des casiers ou si c'est la dernière).
  fields:
    cellar_id:
      description: ID de la cave
      required: true

add_rack:
  name: Ajouter un casier
  description: Ajoute un casier dans une cave.
  fields:
    cellar_id:
      description: ID de la cave (optionnel, première cave par défaut)
    name:
      description: Nom du casier
      example: "Bordeaux"
    columns:
      description: Nombre de colonnes
      example: 8
    shelves:
      description: Nombre d'étagères
      example: 2
    layout:
      description: "Disposition : side_by_side, alternating, alternating_2d, quinconce, semi_lying ou stacked"
      example: "side_by_side"
    levels:
      description: "Niveaux de superposition (2 à 4) — uniquement pour la disposition stacked"
      example: 3
    orientation:
      description: "Sens de départ : punt (piqûre devant) ou neck (goulot devant)"

update_rack:
  name: Modifier un casier
  description: Modifie un casier existant (recherché dans toutes les caves).
  fields:
    rack_id:
      description: ID du casier
      required: true
    name:
      description: Nouveau nom
    columns:
      description: Nombre de colonnes
    shelves:
      description: Nombre d'étagères
    layout:
      description: Disposition
    levels:
      description: "Niveaux de superposition (2 à 4, disposition stacked)"
    orientation:
      description: Sens de départ

add_wine:
  name: Ajouter un vin
  description: Crée un vin avec un premier emplacement. Mêmes champs qu'add_bottle (sans quantity).
  fields:
    rack_id:
      description: ID du casier
      required: true
    slot:
      description: Numéro d'emplacement
      required: true
    name:
      description: Nom du vin
      required: true
    size:
      description: "Format de la bouteille (défaut : 75cl ; ex. : 150cl)"
    favorite:
      description: Coup de cœur (booléen)
    slot_comment:
      description: Commentaire propre à cette bouteille (emplacement)
    added_date:
      description: Date d'ajout (YYYY-MM-DD, défaut aujourd'hui)

update_wine:
  name: Modifier un vin
  description: Met à jour les métadonnées d'un vin (tous ses emplacements).
  fields:
    wine_id:
      description: ID du vin
      required: true

remove_wine:
  name: Supprimer un vin
  description: Supprime un vin et tous ses emplacements.
  fields:
    wine_id:
      description: ID du vin
      required: true

add_slot:
  name: Ajouter un emplacement
  description: Ajoute un emplacement (exemplaire) à un vin existant.
  fields:
    wine_id:
      description: ID du vin
      required: true
    rack_id:
      description: ID du casier
      required: true
    slot:
      description: Numéro d'emplacement
      required: true
    comment:
      description: Commentaire propre à cette bouteille
    size:
      description: "Format propre à cette bouteille (sinon celui du vin ; ex. : 150cl)"

update_slot:
  name: Modifier une bouteille
  description: Met à jour le format et/ou le commentaire d'une bouteille (emplacement) sans la déplacer. Champ vidé → retour à la valeur du vin.
  fields:
    wine_id:
      description: ID du vin
      required: true
    slot_idx:
      description: Index de l'emplacement (0 = premier)
    size:
      description: Format de cette bouteille (ex. 150cl)
    comment:
      description: Commentaire de cette bouteille

move_slot:
  name: Déplacer un emplacement
  description: Déplace un emplacement d'un vin vers une nouvelle position.
  fields:
    wine_id:
      description: ID du vin
      required: true
    slot_idx:
      description: Index de l'emplacement à déplacer (0 = premier)
    rack_id:
      description: ID du casier de destination
      required: true
    slot:
      description: Numéro d'emplacement de destination
      required: true

remove_slot:
  name: Retirer un emplacement
  description: Retire un emplacement d'un vin. Supprime le vin si c'était le dernier.
  fields:
    wine_id:
      description: ID du vin
      required: true
    slot_idx:
      description: Index de l'emplacement à retirer (0 = premier)

swap_slots:
  name: Permuter deux emplacements
  description: Échange atomiquement les positions de deux bouteilles (fonctionne cave pleine).
  fields:
    wine_id_a:
      description: ID du premier vin
      required: true
    slot_idx_a:
      description: Index de l'emplacement dans les slots du premier vin (défaut 0)
    wine_id_b:
      description: ID du second vin
      required: true
    slot_idx_b:
      description: Index de l'emplacement dans les slots du second vin (défaut 0)

remove_rack:
  name: Supprimer un casier
  description: Supprime un casier et retire ses bouteilles.
  fields:
    rack_id:
      description: ID du casier
      required: true

duplicate_bottle:
  name: Dupliquer une bouteille
  description: Duplique une bouteille vers un autre emplacement.
  fields:
    bottle_id:
      description: ID de la bouteille source
      required: true
    floor_id:
      description: ID de l'étage de destination
    slot:
      description: Emplacement de destination

value_snapshot:
  name: Enregistrer la valeur
  description: Enregistre la valeur actuelle de chaque cave dans son historique.
  fields: {}

drink_bottle:
  name: Marquer comme bue
  description: Retire une bouteille de la cave et l'ajoute au journal de dégustation.
  fields:
    bottle_id:
      description: ID de la bouteille
      required: true
    rating:
      description: Note personnelle /5
    comment:
      description: Commentaire de dégustation
    drunk_date:
      description: Date de dégustation (YYYY-MM-DD)

delete_tasting:
  name: Supprimer une dégustation
  description: Supprime une entrée du journal de dégustation.
  fields:
    tasting_id:
      description: ID de l'entrée du journal
      required: true

refresh_wines:
  name: Rafraîchir les fiches
  description: >
    Fusionne les doublons (même nom, millésime, type) puis complète les fiches
    via Gemini. Ne complète que les champs vides, sauf options ci-dessous.
  fields:
    update_prices:
      description: Écrase le prix existant par le prix moyen constaté par Gemini
      example: false
    tighten_apogee:
      description: >
        Recalcule la fenêtre d'apogée (drink_from/drink_until) des vins dont
        l'écart dépasse 12 ans, si le nouveau résultat est lui-même raisonnable
      example: false

import_vinotag:
  name: Importer un export Vinotag
  description: >
    Importe le fichier millesime_import_vinotag.csv déposé dans le dossier de
    configuration ; placement automatique dans les emplacements libres de la
    cave cible (un casier « Import » est créé si la capacité manque).
  fields:
    cellar_id:
      description: ID de la cave cible (optionnel, première cave par défaut)
